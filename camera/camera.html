<html>
	<head>
		<script src="https://cdn.jsdelivr.net/npm/p5@1.6.0/lib/p5.min.js"></script>
		<script src="https://unpkg.com/ml5@0.6.0/dist/ml5.min.js"></script>

		<script type="text/javascript">
			const { ipcRenderer } = require("electron");
			let classifier, video;
			function preload() {
				classifier = ml5.imageClassifier(
					"https://teachablemachine.withgoogle.com/models/1pPPIX1Kx/model.json"
				);
			}
			function setup() {
				createCanvas(320, 260);
				video = createCapture(VIDEO);
				video.size(320, 240);
				classify();
			}
			function classify() {
				classifier.classify(video, (error, result) => {
					if (error) {
						console.error(error);
						return;
					}
					let label = result[0].label.toLowerCase();
					ipcRenderer.send("webcam", label);
					classify();
				});
			}
		</script>
	</head>
</html>
